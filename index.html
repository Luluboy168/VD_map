<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VD 偵測站位置地圖</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
        }
        
        #header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 500;
        }

        #stats {
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        #map-container {
            height: calc(100vh - 60px);
            width: 100%;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            text-align: center;
            font-size: 1.2rem;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Marker Popup Styles */
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.2);
        }
        .custom-popup .leaflet-popup-content {
            margin: 15px;
        }
        .vd-info-title {
            font-weight: bold;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-bottom: 10px;
            margin-top: 0;
            font-size: 1.1em;
        }
        .vd-info-row {
            margin-bottom: 5px;
            font-size: 0.95em;
        }
        .vd-label {
            color: #7f8c8d;
            font-weight: 600;
            display: inline-block;
            width: 70px;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>VD 車輛偵測器分佈地圖</h1>
        <div id="stats">載入中...</div>
    </div>

    <div id="map-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>正在載入與解析資料...</span>
        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet MarkerCluster (For handling many markers efficiently) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // 1. 初始化地圖 (預設中心點設在台灣)
        const map = L.map('map').setView([23.6978, 120.9605], 8);

        // 2. 加入底圖 (使用 OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // 使用 MarkerCluster 來優化大量標記的顯示效能
        const markers = L.markerClusterGroup({
            chunkedLoading: true,
            maxClusterRadius: 50
        });

        // 3. 讀取與解析 CSV 資料
        Papa.parse('VD_parsed.csv', {
            download: true,
            header: true,
            dynamicTyping: true, // 自動轉換數字型態
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                let validCount = 0;

                data.forEach(row => {
                    const lat = row.PositionLat;
                    const lon = row.PositionLon;

                    // 檢查座標是否有效
                    if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
                        
                        // 建立彈出視窗的 HTML 內容
                        const popupContent = `
                            <div class="custom-popup">
                                <h3 class="vd-info-title">${row.VDID || '未知 VDID'}</h3>
                                <div class="vd-info-row"><span class="vd-label">道路:</span> ${row.RoadName || '-'} (Class: ${row.RoadClass || '-'})</div>
                                <div class="vd-info-row"><span class="vd-label">區段:</span> ${row.RoadSection_Start || '-'} ➔ ${row.RoadSection_End || '-'}</div>
                                <div class="vd-info-row"><span class="vd-label">里程:</span> ${row.LocationMile || '-'}</div>
                                <div class="vd-info-row"><span class="vd-label">方向:</span> ${row.Link_RoadDirection || '-'} (Bearing: ${row.Link_Bearing || '-'})</div>
                                <div class="vd-info-row"><span class="vd-label">車道數:</span> ${row.Link_LaneNum || '-'}</div>
                            </div>
                        `;

                        // 建立標記並加入 Cluster Group
                        const marker = L.marker([lat, lon]);
                        marker.bindPopup(popupContent);
                        markers.addLayer(marker);
                        
                        validCount++;
                    }
                });

                // 將標記群組加入地圖
                map.addLayer(markers);

                // 如果有資料，自動將地圖範圍縮放到包含所有標記的視圖
                if (validCount > 0) {
                    map.fitBounds(markers.getBounds(), { padding: [50, 50] });
                }

                // 更新狀態顯示並隱藏載入中提示
                document.getElementById('stats').innerText = `已載入 ${validCount} 個偵測站`;
                document.getElementById('loading').style.display = 'none';
            },
            error: function(err) {
                console.error('CSV 載入失敗:', err);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #e74c3c; font-size: 2em;">⚠️</div>
                    <span style="color: #e74c3c;">資料載入失敗，可能是檔案不存在或需要透過伺服器開啟此網頁 (CORS 限制)。</span>
                    <span style="font-size: 0.9em; color: #7f8c8d; margin-top: 10px;">請確保 VD_parsed.csv 與 map.html 位於同一資料夾，並且您使用本地伺服器開啟。</span>
                `;
            }
        });
    </script>
</body>
</html>
